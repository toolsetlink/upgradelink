Name: task
Host: 0.0.0.0
Port: 9120
MaxBytes: 1073741824 # max content length : 1 gb | 所有类型单个文件最大大小
Timeout: 600000 # bigger max bytes need longer timeout | 超时时间

Log:
  ServiceName: upgradelink-admin-task
  Mode: file
  Encoding: json
  TimeFormat: "2006-01-02 15:04:05.000"
  Path: /link/logs/task
  Level: debug
  KeepDays: 3
  Rotation: daily

MysqlConfig: "root:Rootroot123!@tcp(host.docker.internal:3306)/upgrade?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai"

RedisConfig:
  Host: host.docker.internal:6379
  Type: node
  Pass: a123456
  Tls: false
  NonBlock: false

FileApi: "http://0.0.0.0:9102"
